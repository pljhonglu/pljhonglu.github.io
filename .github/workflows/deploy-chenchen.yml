name: Deploy chenchen-learning addon
on:
  push:
    branches: [main]
    paths:
      - 'static/chenchen-learning/**'
      - '.github/workflows/deploy-chenchen.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror live site and deploy classic chenchen-learning files
        run: |
          set -euo pipefail
          mkdir -p public
          curl -fsSL https://pljhonglu.github.io/sitemap.xml -o /tmp/sitemap.xml || true
          python3 - <<'PY'
          import re, subprocess, pathlib, urllib.parse
          root = pathlib.Path('public')
          root.mkdir(exist_ok=True)
          urls = ['https://pljhonglu.github.io/']
          try:
            text = pathlib.Path('/tmp/sitemap.xml').read_text(encoding='utf-8', errors='ignore')
            urls += re.findall(r'<loc>(.*?)</loc>', text)
          except Exception:
            pass
          seen=set()
          for u in urls:
            if u in seen: continue
            seen.add(u)
            path = urllib.parse.urlparse(u).path
            if not path or path.endswith('/'):
              rel = path.lstrip('/') + 'index.html'
            else:
              rel = path.lstrip('/')
              if not rel.endswith('.html') and '.' not in rel.split('/')[-1]:
                rel = rel.rstrip('/') + '/index.html'
            dest = root / rel
            dest.parent.mkdir(parents=True, exist_ok=True)
            subprocess.run(['curl','-fsSL',u,'-o',str(dest)], check=False)
          assets = [
            '/css/main.min.css','/css/style.min.css','/favicon.ico',
            '/favicon-32x32.png','/favicon-16x16.png','/apple-touch-icon.png',
            '/index.xml','/lib/katex/katex.min.css','/lib/katex/copy-tex.min.css',
          ]
          for a in assets:
            dest = root / a.lstrip('/')
            dest.parent.mkdir(parents=True, exist_ok=True)
            subprocess.run(['curl','-fsSL','https://pljhonglu.github.io'+a,'-o',str(dest)], check=False)
          PY
          rm -rf public/chenchen-learning
          mkdir -p public/chenchen-learning
          BASE=https://raw.githubusercontent.com/pljhonglu/chenchen-learning/main
          # Prefer classic multi-file from repo root; fall back to unpacking deploy-src parts
          if curl -fsSL "$BASE/poems.js" -o /tmp/poems.js && grep -q 'const POEMS' /tmp/poems.js && \
             curl -fsSL "$BASE/app.js" -o /tmp/app.js && \
             curl -fsSL "$BASE/styles.css" -o /tmp/styles.css && \
             curl -fsSL "$BASE/index.html" -o /tmp/index.html && \
             grep -q 'src="poems.js"' /tmp/index.html; then
            cp /tmp/index.html /tmp/styles.css /tmp/app.js /tmp/poems.js public/chenchen-learning/
            curl -fsSL "$BASE/README.md" -o public/chenchen-learning/README.md || true
            curl -fsSL "$BASE/.nojekyll" -o public/chenchen-learning/.nojekyll || true
          else
            mkdir -p /tmp/parts
            for i in 0 1 2 3; do
              curl -fsSL "$BASE/deploy-src/classic.part${i}.b64" -o "/tmp/parts/classic.part${i}.b64"
            done
            cat /tmp/parts/classic.part*.b64 | tr -d '\n\r ' | base64 -d > /tmp/classic.tar.gz
            tar xzf /tmp/classic.tar.gz -C public/chenchen-learning
          fi
          touch public/chenchen-learning/.nojekyll
          ls -la public/chenchen-learning/
          test -s public/chenchen-learning/index.html
          test -s public/chenchen-learning/styles.css
          test -s public/chenchen-learning/app.js
          test -s public/chenchen-learning/poems.js
          grep -q 'src="poems.js"' public/chenchen-learning/index.html
          grep -q 'const POEMS' public/chenchen-learning/poems.js
          python3 - <<'PY'
          import re, pathlib
          t = pathlib.Path('public/chenchen-learning/poems.js').read_text(encoding='utf-8')
          n = len(re.findall(r'"id"\s*:\s*"poem-', t))
          print('poem ids', n)
          assert n >= 30, n
          html = pathlib.Path('public/chenchen-learning/index.html').read_text(encoding='utf-8')
          assert 'gzip' not in html.lower() and 'DecompressionStream' not in html
          print('classic index ok')
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
